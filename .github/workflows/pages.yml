name: Publish Pawfect website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out hosting package
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Extract production website
        run: unzip -q pawfect-static.zip -d _site
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
